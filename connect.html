    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #fafbfc;
            --bg-secondary: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-glow: rgba(37, 99, 235, 0.2);
            --success: #10b981;
            --error: #ef4444;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        body.dark {
            --bg: #0a0e1a;
            --bg-secondary: #1a1f2e;
            --text: #f1f5f9;
            --text-light: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --nav-bg: rgba(26, 31, 46, 0.85);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        

        

        /* --- LOGO STYLES (Analytics Concept) --- */
        
        
        
        
        
        
        
        

        

        

        

        

        

        

        

        

        .page-wrapper {
            display: flex;
            height: calc(100vh - 65px);
            margin-top: 65px;
            overflow: hidden;
        }

        .hero-section {
            flex: 1;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-25px, 25px); }
        }

        .hero-content {
            text-align: left;
            width: 460px;
            max-width: 100%;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        /* --- IMAGE: soft glow blend instead of a boxed card --- */
        .hero-image-wrap {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 0 0.75rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .hero-image-wrap::before {
            content: '';
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 65%);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 0;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .hero-image {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 24px;
            filter: drop-shadow(0 20px 35px rgba(37, 99, 235, 0.25));
            border: none;
            background: transparent;
            opacity: 0;
            transition: transform 0.3s ease;
        }

        .hero-image.is-loaded {
            opacity: 1;
        }

        .hero-image:hover {
            transform: scale(1.04);
        }

        .hero-subtitle {
            font-size: 1.65rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            height: 4.6rem; /* fixed: reserves space for 2 lines so title never shifts */
            text-align: left;
            overflow: hidden;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.05em;
            background: var(--primary);
            margin-left: 3px;
            border-radius: 2px;
            vertical-align: text-bottom;
            animation: cursorPulse 0.9s ease-in-out infinite;
        }

        @keyframes cursorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .cursor.done {
            width: auto;
            height: auto;
            background: none;
            color: var(--primary);
            font-weight: 800;
            animation: none;
            opacity: 1;
        }

        /* --- TITLE: small, minimal brand tag. Fixed slot, left-aligned, never shifts --- */
        .hero-title-slot {
            height: 2rem;
            margin-top: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-light);
            display: flex;
            justify-content: flex-start;
            gap: 1px;
        }

        .hero-title .letter {
            display: inline-block;
            transform-origin: bottom;
            will-change: transform;
        }

        .hero-title .letter.accent {
            color: var(--primary);
        }

        .title-accent {
            width: 22px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            margin: 0.4rem 0 0;
            transform-origin: left;
        }

        .form-section {
            flex: 1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .form-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--card-shadow);
            margin: 1rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 1rem;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            border: none;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .signup-btn {
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .signup-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.75rem 0 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 0.875rem;
        }

        .social-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 0.9375rem;
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
            background: var(--bg-secondary);
        }

        .social-btn .social-icon {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-text {
            font-weight: 600;
        }

        .security-note {
            text-align: center;
            padding: 1rem;
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(37, 99, 235, 0.1);
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .security-note i {
            color: var(--success);
            margin-right: 0.25rem;
        }

        

        .toast {
            position: fixed;
            top: 85px;
            right: 1.5rem;
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            font-size: 0.875rem;
            transform: translateX(120%);
            transition: transform 0.4s ease;
            z-index: 1000;
            box-shadow: var(--card-shadow);
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.show { transform: translateX(0); }

        @media (max-width: 968px) {
            .hero-section {
                flex: 0.8;
            }
            
            .hero-content {
                width: 380px;
                max-width: 100%;
            }
            
            .hero-image-wrap {
                width: 280px;

            .hero-title {
                font-size: 0.85rem;
                letter-spacing: 3px;
            }

            .hero-title-slot {
                height: 1.75rem;
            }
        }

        @media (max-width: 768px) {
            

            .page-wrapper {

                align-items: stretch;
            }

            .form-card {
                padding: 2rem 1.5rem;
                border: none;
                box-shadow: none;
                border-radius: 0;
                margin: 0;
                max-width: 100%;
                width: 100%;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .form-header {
                margin-bottom: 2rem;
            }

            .form-header h1 {
                font-size: 1.875rem;
            }

            .form-header p {
                font-size: 0.9375rem;
            }

            .auth-buttons {
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            .auth-btn {
                padding: 1.125rem 1.5rem;
                font-size: 1rem;
            }

            .divider {
                margin: 1.75rem 0 1.5rem;
            }

            .social-btn {
                padding: 1.125rem 1.25rem;
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }

            .security-note {
                font-size: 0.85rem;
            }

            
            
            

            

            

            

            
            
            
            
            

            .toast {
                top: 68px;
                right: 1rem;
                left: 1rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .form-card { 
                padding: 1.75rem 1.25rem;
            }

            .form-header h1 { 
                font-size: 1.625rem; 
            }

            .form-header p {
                font-size: 0.875rem;
            }

            .auth-buttons {
                gap: 0.875rem;
            }

            .auth-btn {
                padding: 1rem 1.25rem;
                font-size: 0.95rem;
            }

            .divider {
                margin: 1.5rem 0 1.25rem;
                font-size: 0.8rem;
            }

            .social-btn {
                padding: 1rem 1.125rem;
                font-size: 0.95rem;
            }

            .security-note {
                font-size: 0.75rem;
                padding: 0.875rem;
            }

            

            
            
            
        }

        /* Landscape Mobile Optimization */
        @media (max-width: 768px) and (orientation: landscape) {
            .form-card {
                padding: 1.5rem 1.25rem;
                justify-content: flex-start;
                padding-top: 1rem;
            }

            .form-header {
                margin-bottom: 1.25rem;
            }

            .form-header h1 {
                font-size: 1.625rem;
            }

            .auth-buttons {
                gap: 0.75rem;
                margin-bottom: 1.25rem;
            }

            .auth-btn {
                padding: 0.875rem 1.25rem;
            }

            .divider {
                margin: 1.25rem 0 1rem;
            }

            .social-btn {
                padding: 0.875rem 1.125rem;
                margin-bottom: 1.25rem;
            }

            .security-note {
                padding: 0.75rem;
                font-size: 0.75rem;
            }
        }
    </style>

    <script>
        gsap.registerPlugin(TextPlugin);

        /* ---------- Logo + Title bar-style animation ---------- */
        function animLogo() {
            gsap.fromTo(".logo-bar",
                { scaleY: 0.3 },
                { scaleY: 1, duration: 0.4, stagger: 0.1, ease: "back.out(1.7)", overwrite: true }
            );
            gsap.fromTo(".hero-title .letter",
                { scaleY: 0.3, opacity: 0, y: 10 },
                { scaleY: 1, opacity: 1, y: 0, duration: 0.55, stagger: 0.05, ease: "power3.out", overwrite: true }
            );
            gsap.fromTo(".title-accent",
                { scaleX: 0 },
                { scaleX: 1, duration: 0.5, delay: 0.4, ease: "power3.out", overwrite: true }
            );
        }

        function buildTitle() {
            const el = document.getElementById('heroTitle');
            const word = "SEOTIZE";
            const last = word.length - 1;
            el.innerHTML = word
                .split('')
                .map((l, i) => `<span class="letter${i === last ? ' accent' : ''}">${l}</span>`)
                .join('');
        }

        /* ---------- Showcase data: each subtitle paired with its own distinct image ---------- */
        const showcaseData = [
            { text: "🌴 Explore SEO, rank higher", image: "https://image-api.seotize.net/image-cdn/a8417011-bee3-47df-b50c-0758594b2533" },
            { text: "🧜‍♂️ Dive in, let AI do the work", image: "https://image-api.seotize.net/image-cdn/9880be9e-eb78-4272-b14c-eb31f30f113b" },
            { text: "🏰 Build a kingdom of traffic", image: "https://image-api.seotize.net/image-cdn/3c015f43-9e5b-44f8-a945-11738d4edd70" },
            { text: "💎 Find hidden ranks in seconds", image: "https://image-api.seotize.net/image-cdn/0c7dcab7-6ebd-4e7e-8d0e-8af0f2bfdfbc" },
            { text: "🚪 Unlock the algorithm's secrets", image: "https://image-api.seotize.net/image-cdn/d334c773-32a7-47dc-a3f7-bd2e97bebe90" }
        ];

        let currentIndex = 0;

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'ri-sun-line' : 'ri-moon-line';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'ri-sun-line';
            }
        }

        function type() {
            const e = document.getElementById('typeText');
            if (!e) return;

            const text = showcaseData[currentIndex].text;
            e.innerHTML = '<span class="cursor"></span>';

            gsap.to(e, {
                duration: text.length * 0.04,
                text: { value: text },
                onUpdate: () => {
                    if (!e.innerHTML.includes('cursor')) e.innerHTML += '<span class="cursor"></span>';
                },
                onComplete: () => {
                    e.innerHTML = e.innerHTML.replace(
                        /<span class="cursor"><\/span>/,
                        '<span class="cursor done">.</span>'
                    );
                }
            });
        }

        function updateShowcase() {
            const image = document.getElementById('showcaseImage');
            const current = showcaseData[currentIndex];

            gsap.to(image, {
                scale: 0.9,
                opacity: 0.6,
                duration: 0.3,
                onComplete: () => {
                    image.src = current.image;
                    gsap.to(image, {
                        scale: 1,
                        opacity: 1,
                        duration: 0.4,
                        ease: "back.out(1.7)"
                    });
                }
            });

            setTimeout(type, 300);
        }

        /* ---------- Preload every showcase image before starting the rotation ---------- */
        function preloadImages(urls) {
            return Promise.all(urls.map(url => new Promise(resolve => {
                const img = new Image();
                img.onload = resolve;
                img.onerror = resolve;
                img.src = url;
            })));
        }

        function init() {
            const image = document.getElementById('showcaseImage');
            image.addEventListener('load', () => image.classList.add('is-loaded'), { once: true });
            image.src = showcaseData[currentIndex].image;

            const tl = gsap.timeline();

            tl.fromTo('.hero-content',
                { opacity: 0, y: 30 },
                { opacity: 1, y: 0, duration: 1, ease: "power3.out" }
            )
            .fromTo('.hero-image-wrap',
                { opacity: 0, scale: 0.85 },
                { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.7)" },
                "-=0.7"
            )
            .fromTo('.form-card',
                { opacity: 0, x: 50 },
                { opacity: 1, x: 0, duration: 1, ease: "power3.out" },
                "-=0.6"
            )
            .fromTo('.auth-btn',
                { opacity: 0, y: 30 },
                { opacity: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "back.out(1.7)" },
                "-=0.3"
            )
            .fromTo('.divider',
                { opacity: 0, scale: 0.8 },
                { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" },
                "-=0.1"
            )
            .fromTo('.social-btn',
                { opacity: 0, y: 20 },
                { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" },
                "-=0.1"
            )
            .fromTo('.security-note',
                { opacity: 0, y: 15 },
                { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
                "-=0.2"
            );

            type();
            animLogo();

            setInterval(() => {
                currentIndex = (currentIndex + 1) % showcaseData.length;
                updateShowcase();
            }, 5000);
        }

        // Hover animations for buttons
        document.querySelectorAll('.auth-btn, .social-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                gsap.to(btn, { scale: 1.02, duration: 0.3, ease: "power2.out" });
            });
            btn.addEventListener('mouseleave', () => {
                gsap.to(btn, { scale: 1, duration: 0.3, ease: "power2.out" });
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            buildTitle();
            init();
            // preload the remaining images quietly in the background for smooth later swaps
            preloadImages(showcaseData.slice(1).map(d => d.image));
        });
    </script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script defer src="/assets/site.js"></script>
</body>
</html>
