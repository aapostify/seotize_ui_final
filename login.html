<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SEOTIZE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #fafbfc;
            --bg-secondary: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-glow: rgba(37, 99, 235, 0.2);
            --success: #10b981;
            --error: #ef4444;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        body.dark {
            --bg: #0a0e1a;
            --bg-secondary: #1a1f2e;
            --text: #f1f5f9;
            --text-light: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --nav-bg: rgba(26, 31, 46, 0.85);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        

        

        /* --- LOGO STYLES (Analytics Concept) --- */

        

        

        
        
        

        

        

        

        

        

        

        

        

        .page-wrapper {
            display: flex;
            height: calc(100vh - 65px);
            margin-top: 65px;
            overflow: hidden;
        }

        .hero-section {
            flex: 1;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-25px, 25px); }
        }

        .hero-content {
            text-align: left;
            width: 460px;
            max-width: 100%;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        /* --- IMAGE: soft glow blend instead of a boxed card --- */
        .hero-image-wrap {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 0 0.75rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .hero-image-wrap::before {
            content: '';
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 65%);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 0;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .hero-image {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 24px;
            filter: drop-shadow(0 20px 35px rgba(37, 99, 235, 0.25));
            border: none;
            background: transparent;
            opacity: 0;
            transition: transform 0.3s ease;
        }

        .hero-image.is-loaded {
            opacity: 1;
        }

        .hero-image:hover {
            transform: scale(1.04);
        }

        .hero-subtitle {
            font-size: 1.65rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            height: 4.6rem; /* fixed: reserves space for 2 lines so title never shifts */
            text-align: left;
            overflow: hidden;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.05em;
            background: var(--primary);
            margin-left: 3px;
            border-radius: 2px;
            vertical-align: text-bottom;
            animation: cursorPulse 0.9s ease-in-out infinite;
        }

        @keyframes cursorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .cursor.done {
            width: auto;
            height: auto;
            background: none;
            color: var(--primary);
            font-weight: 800;
            animation: none;
            opacity: 1;
        }

        /* --- TITLE: small, minimal brand tag. Fixed slot, left-aligned, never shifts --- */
        .hero-title-slot {
            height: 2rem;
            margin-top: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-light);
            display: flex;
            justify-content: flex-start;
            gap: 1px;
        }

        .hero-title .letter {
            display: inline-block;
            transform-origin: bottom;
            will-change: transform;
        }

        .hero-title .letter.accent {
            color: var(--primary);
        }

        .title-accent {
            width: 22px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            margin: 0.4rem 0 0;
            transform-origin: left;
        }

        .form-section {
            flex: 1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .form-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--card-shadow);
            margin: 1rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .form-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 0.9375rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.875rem 2.75rem 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9375rem;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        input.success {
            border-color: var(--success);
        }

        input.error {
            border-color: var(--error);
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 2.625rem;
            font-size: 1rem;
        }

        .input-icon.success {
            color: var(--success);
        }

        .input-icon.error {
            color: var(--error);
        }

        /* FIXED Captcha Styling - Desktop */
        .captcha-wrap {
            margin: 1.25rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 65px;
        }

        .cf-turnstile {
            width: 300px !important;
            height: 65px !important;
            margin: 0 auto !important;
        }

        .cf-turnstile > div,
        .cf-turnstile iframe {
            width: 300px !important;
            height: 65px !important;
            margin: 0 auto !important;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .check {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 5px;
            position: relative;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .check.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .check.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .forgot {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .forgot:hover {
            text-decoration: underline;
            color: var(--primary-dark);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .submit-btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0 1.25rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 0.875rem;
        }

        .social-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 0.9375rem;
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
            background: var(--bg-secondary);
        }

        .social-btn .social-icon {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn .social-text {
            font-weight: 600;
        }

        .signup {
            text-align: center;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .signup a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 85px;
            right: 1.5rem;
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            font-size: 0.875rem;
            transform: translateX(120%);
            transition: transform 0.4s ease;
            z-index: 1000;
            box-shadow: var(--card-shadow);
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.show { transform: translateX(0); }

        

        @media (max-width: 968px) {
            .hero-section {
                flex: 0.8;
            }

            .hero-content {
                width: 380px;
                max-width: 100%;
            }

            .hero-image-wrap {
                width: 280px;
                height: 280px;
            }

            .hero-title {
                font-size: 0.85rem;
                letter-spacing: 3px;
            }

            .hero-title-slot {
                height: 1.75rem;
            }
        }

        @media (max-width: 768px) {
            

            .page-wrapper {
                margin-top: 58px;
                height: calc(100vh - 58px - 68px);
            }

            

            .hero-section { display: none; }

            .form-section {
                padding: 0;
                height: calc(100vh - 58px - 68px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                display: flex;
                align-items: stretch;
            }

            .form-card {
                padding: 2rem 1.5rem;
                border: none;
                box-shadow: none;
                border-radius: 0;
                margin: 0;
                max-width: 100%;
                width: 100%;
                min-height: 100%;
                display: flex;
                flex-direction: column;
            }

            /* Mobile Captcha - Match Input Width Exactly */
            .captcha-wrap {
                margin: 1.5rem 0;
                min-height: 65px;
                width: 100%;
                padding: 0;
            }

            .cf-turnstile {
                width: 100% !important;
                max-width: 100% !important;
                height: 65px !important;
            }

            .cf-turnstile > div,
            .cf-turnstile iframe {
                width: 100% !important;
                max-width: 100% !important;
                height: 65px !important;
            }

            .form-header {
                margin-bottom: 1.5rem;
            }

            .form-header h1 {
                font-size: 1.75rem;
            }

            .form-header p {
                font-size: 0.9rem;
            }

            .input-group {
                margin-bottom: 1.25rem;
            }

            .submit-btn {
                padding: 1.125rem 1rem;
                font-size: 1rem;
                margin-bottom: 1.25rem;
            }

            .divider {
                margin: 1.75rem 0 1.5rem;
            }

            .social-btn {
                padding: 1.125rem 1.25rem;
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }

            .signup {
                font-size: 0.9rem;
                margin-top: 0.5rem;
            }

            
            
            

            

            

            

            
            
            

            

            .toast {
                top: 68px;
                right: 1rem;
                left: 1rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 1.75rem 1.25rem;
            }

            .form-header h1 {
                font-size: 1.5rem;
            }

            .form-header p {
                font-size: 0.875rem;
            }

            .input-group {
                margin-bottom: 1.125rem;
            }

            input {
                padding: 0.8rem 2.5rem 0.8rem 0.9rem;
                font-size: 0.9rem;
            }

            .captcha-wrap {
                margin: 1rem 0;
            }

            .submit-btn {
                padding: 1rem;
                font-size: 0.95rem;
            }

            .divider {
                margin: 1.5rem 0 1.25rem;
                font-size: 0.8rem;
            }

            .social-btn {
                padding: 1rem 1.125rem;
                font-size: 0.95rem;
            }

            .signup {
                font-size: 0.85rem;
            }

            

            
            
        }

        /* Landscape Mobile Optimization */
        @media (max-width: 768px) and (orientation: landscape) {
            .form-card {
                padding: 1.5rem 1.25rem;
                justify-content: flex-start;
                padding-top: 1rem;
            }

            .form-header {
                margin-bottom: 1rem;
            }

            .form-header h1 {
                font-size: 1.5rem;
            }

            .input-group {
                margin-bottom: 1rem;
            }

            .captcha-wrap {
                margin: 1rem 0;
                min-height: 60px;
            }

            .submit-btn {
                padding: 0.9rem 1rem;
                margin-bottom: 1rem;
            }

            .divider {
                margin: 1.25rem 0 1rem;
            }

            .social-btn {
                padding: 0.9rem 1.125rem;
                margin-bottom: 1rem;
            }
        }
    </style>
    <style id="seotize-polish">
        /* 2026 theme polish — aligns auth pages with the redesigned site */
        body.dark { --bg:#0a0e1a; --bg-secondary:#121827; --border:#232c40; --nav-bg:rgba(13,18,32,.72); --card-shadow:0 30px 60px -30px rgba(0,0,0,.8); }
        body { font-family:'Inter',system-ui,sans-serif; }
        .form-header h1 { font-family:'Outfit','Inter',sans-serif; letter-spacing:-.03em; }
        
        
        
        
        .form-card { border-radius:26px; box-shadow:0 30px 70px -35px rgba(15,23,42,.35); position:relative; overflow:hidden; }
        .form-card::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--primary),#06b6d4); }
        input, select { border-width:1px !important; border-radius:12px !important; }
        input:focus, select:focus { box-shadow:0 0 0 4px var(--primary-glow) !important; }
        button[type="submit"], .btn-primary { border-radius:12px; box-shadow:0 12px 26px -12px var(--primary-glow); }
        .captcha-wrap { display:flex !important; justify-content:center !important; align-items:center; width:100%; }
        .cf-turnstile { margin:0 auto; }
    </style>
    <style id="seotize-chrome">
        .auth-scene { width: min(360px, 100%); aspect-ratio: 1; margin: 0 auto 1.25rem; }
        .auth-scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .hero-image-wrap .auth-scene { width: 100%; height: 100%; margin: 0; position: relative; z-index: 1; }
        @media (max-height: 760px) { .auth-scene { width: min(280px, 100%); } }
        .page-wrapper { margin-top: var(--nav-h) !important; height: calc(100dvh - var(--nav-h)) !important; }
        @media (max-width: 768px) {
            body { padding-bottom: 0 !important; }
            .page-wrapper { height: calc(100dvh - var(--nav-h)) !important; }
            .form-section { height: 100% !important; padding-bottom: calc(var(--mnav-h) + 1.4rem + env(safe-area-inset-bottom)) !important; }
        }
    </style>
</head>

    <div class="page-wrapper">
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-image-wrap">
                    <div class="auth-scene" data-auth-scene="login" aria-label="Your SEOTIZE dashboard updating with fresh results"></div>
                </div>
                <div class="hero-subtitle" id="typeText"></div>
                <div class="hero-title-slot">
                    <div>
                        <h1 class="hero-title" id="heroTitle"></h1>
                        <div class="title-accent"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="form-card">
                <div class="form-header">
                    <h1>Sign In to Your Account</h1>
                    <p>Continue your SEO journey</p>
                </div>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                        <div class="input-icon" id="emailIcon"></div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <div class="input-icon" id="passwordIcon"></div>
                    </div>
                    <div class="captcha-wrap">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAABi0oSEk-fxks-xg" data-callback="onCaptcha" data-theme="auto" data-size="flexible"></div>
                    </div>
                    <div class="form-row">
                        <label class="remember" onclick="toggleCheck()">
                            <div class="check" id="check"></div>

                        <a href="forgot-password.html" class="forgot">Forgot Password?</a>

                    <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>

                <div class="divider"><span>or continue with</span></div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        gsap.registerPlugin(TextPlugin);

        /* ---------- Logo + Title bar-style animation ---------- */
        function animLogo() {
            /* logo animates with CSS */
            gsap.fromTo(".hero-title .letter",
                { scaleY: 0.3, opacity: 0, y: 10 },
                { scaleY: 1, opacity: 1, y: 0, duration: 0.55, stagger: 0.05, ease: "power3.out", overwrite: true }
            );
            gsap.fromTo(".title-accent",
                { scaleX: 0 },
                { scaleX: 1, duration: 0.5, delay: 0.4, ease: "power3.out", overwrite: true }
            );
        }

        function buildTitle() {
            const el = document.getElementById('heroTitle');
            const word = "SEOTIZE";
            const last = word.length - 1;
            el.innerHTML = word
                .split('')
                .map((l, i) => `<span class="letter${i === last ? ' accent' : ''}">${l}</span>`)
                .join('');
        }

        /* ---------- Showcase data: unique to the sign-in page (returning-user tone) ---------- */
        const showcaseData = [
            { text: "👋 Welcome back, pick up where you left off" },
            { text: "📊 Your dashboard has fresh insights waiting" },
            { text: "📈 See how far your rankings climbed" },
            { text: "🔔 Catch up on what changed while you were away" },
            { text: "🔐 Your SEO command center is ready" }
        ];

        let currentIndex = 0;

        const API = 'https://api.seotize.net';
        let remember = false, token = null;

        function onCaptcha(t) { token = t; }
        function toggleCheck() { remember = !remember; document.getElementById('check').classList.toggle('checked', remember); }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'ri-sun-line' : 'ri-moon-line';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'ri-sun-line';
            }
        }

        function type() {
            const e = document.getElementById('typeText');
            if (!e) return;

            const text = showcaseData[currentIndex].text;
            e.innerHTML = '<span class="cursor"></span>';

            gsap.to(e, {
                duration: text.length * 0.04,
                text: { value: text },
                onUpdate: () => {
                    if (!e.innerHTML.includes('cursor')) e.innerHTML += '<span class="cursor"></span>';
                },
                onComplete: () => {
                    e.innerHTML = e.innerHTML.replace(
                        /<span class="cursor"><\/span>/,
                        '<span class="cursor done">.</span>'
                    );
                }
            });
        }

        function updateShowcase() {
            setTimeout(type, 300);
        }

        /* ---------- Preload showcase images in the background, no blocking on load ---------- */
        function preloadImages(urls) {
            return Promise.all(urls.map(url => new Promise(resolve => {
                const img = new Image();
                img.onload = resolve;
                img.onerror = resolve;
                img.src = url;
            })));
        }

        function initShowcase() {
            type();
            setInterval(() => {
                currentIndex = (currentIndex + 1) % showcaseData.length;
                updateShowcase();
            }, 5000);
        }


        function validate(inp, iconId) {
            const v = inp.value.trim(), icon = document.getElementById(iconId);
            if (inp.type === 'email') { const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); inp.className = v ? ok ? 'success' : 'error' : ''; icon.innerHTML = v ? ok ? '✓' : '✗' : ''; icon.className = `input-icon ${v ? ok ? 'success' : 'error' : ''}`; }
            else { const ok = v.length >= 8; inp.className = v ? ok ? 'success' : 'error' : ''; icon.innerHTML = v ? ok ? '✓' : '✗' : ''; icon.className = `input-icon ${v ? ok ? 'success' : 'error' : ''}`; }
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim(), pass = document.getElementById('password').value.trim(), btn = document.getElementById('submitBtn');
            if (!email || !pass) { toast('Fill all fields', 'error'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Invalid email', 'error'); return; }
            if (pass.length < 8) { toast('Password too short', 'error'); return; }
            if (!token) { toast('Complete captcha', 'error'); return; }
            btn.classList.add('loading'); btn.innerHTML = '<div class="spinner"></div>Signing in...';
            try {
                const r = await fetch(`${API}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass, 'cf-turnstile-response': token }) });
                const d = await r.json(); btn.classList.remove('loading'); btn.innerHTML = 'Sign In';
                if (d.status === 'success') { setCookie('session_token', d.data.session_token, remember ? 7 : null); toast('Login successful!', 'success'); setTimeout(() => window.location.href = '/dashboard', 1000); }
                else { toast(d.error?.message || 'Login failed', 'error'); token = null; if (window.turnstile) window.turnstile.reset(); }
            } catch (err) { btn.classList.remove('loading'); btn.innerHTML = 'Sign In'; toast('Network error', 'error'); token = null; if (window.turnstile) window.turnstile.reset(); }
        }

        function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = `toast ${type} show`; setTimeout(() => t.classList.remove('show'), 3000); }
        function setCookie(n, v, d) { let e = ""; if (d) { const dt = new Date(); dt.setTime(dt.getTime() + (d * 24 * 60 * 60 * 1000)); e = "; expires=" + dt.toUTCString(); } document.cookie = n + "=" + (v || "") + e + "; path=/; Domain=.seotize.net; SameSite=Lax; Secure"; }
        function getCookie(n) { const nEQ = n + "=", ca = document.cookie.split(';'); for (let i = 0; i < ca.length; i++) { let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length); if (c.indexOf(nEQ) == 0) return c.substring(nEQ.length, c.length); } return null; }

        document.getElementById('email').addEventListener('input', e => validate(e.target, 'emailIcon'));
        document.getElementById('password').addEventListener('input', e => validate(e.target, 'passwordIcon'));
        document.getElementById('loginForm').addEventListener('submit', login);

        document.addEventListener('DOMContentLoaded', () => {
            if (getCookie('session_token')) { window.location.href = '/dashboard'; return; }
            loadTheme();
            buildTitle();
            if (window.innerWidth > 768) { initShowcase(); }
            animLogo();
        });
    </script>
